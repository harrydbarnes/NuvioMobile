name: Build Android APK on PR

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build full debug APK
        run: ./gradlew :composeApp:assembleFullDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-full-debug-apk-harrybarnes
          path: composeApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
