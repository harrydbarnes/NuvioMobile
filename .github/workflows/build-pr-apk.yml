name: Build PR APK

on:
  pull_request:

jobs:
  build-pr-apk:
    name: Build PR APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :composeApp:assembleFullPr

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-harrybarnes-pr-apk
          path: composeApp/build/outputs/apk/full/pr/*.apk
          if-no-files-found: error
